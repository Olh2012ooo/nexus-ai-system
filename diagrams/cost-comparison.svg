<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="Cost per 1 billion tokens"><defs><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#5b6b82"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker><marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker><marker id="v" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#047857"/></marker></defs><rect width="1200" height="580" fill="#ffffff"/><text x="44" y="48" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b1220">Cost per 1 billion tokens</text><text x="44" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6b82">Claude Opus 5.5 at its documented assumptions vs Nexus in one observed window. The two columns are not mix-adjusted.</text><text x="274" y="154" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0b1220" text-anchor="end" font-weight="700">Claude Opus 5.5</text><text x="274" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="end" font-weight="400">80 % cache hit · 20.42 % output</text><rect x="300" y="128" width="470.0" height="56" rx="7" fill="#b91c1c" opacity="0.92"/><text x="754.0" y="163" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="end" font-weight="700">53 127 NOK</text><text x="274" y="270" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0b1220" text-anchor="end" font-weight="700">Nexus</text><text x="274" y="292" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="end" font-weight="400">99.2 % cache hit · 0.39 % output</text><rect x="300" y="244" width="6.0" height="56" rx="7" fill="#047857" opacity="0.92"/><text x="322" y="279" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#047857" text-anchor="start" font-weight="700">62 NOK</text><text x="300" y="352" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">true length 0.12 % (about half a pixel); the Nexus bar is drawn at a 6 px minimum so it stays visible</text><rect x="810" y="118" width="346" height="216" rx="14" fill="#f6f8fb" stroke="#d7dee8"/><text x="836" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" fill="#047857" text-anchor="start" font-weight="700">856×</text><text x="836" y="206" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6b82" text-anchor="start" font-weight="400">lower calculated cost</text><line x1="836" y1="226" x2="1130" y2="226" stroke="#d7dee8"/><text x="836" y="258" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0b1220" text-anchor="start" font-weight="600">99.88 % reduction</text><text x="836" y="288" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0b1220" text-anchor="start" font-weight="600">53 065 NOK saved per billion</text><text x="836" y="314" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">USD/NOK 9.6866</text><text x="44" y="396" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">Nexus: $6.41 per billion at an observed mix (0.39 % output, 99.2 % cache hit) → 62 NOK.</text><text x="44" y="414" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">Calculated from runtime token volumes at published DeepSeek prices; absolute spend is not published.</text><text x="44" y="438" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">Claude: $4.00/M input, $0.20/M cache read, $8.00/M 1-hour write, $20.00/M output, 80 % cache hit, 20.42 % output share — assumptions unchanged.</text><text x="44" y="466" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="400">Not mix-adjusted: each column is per billion tokens at its own token mix, so the ratio combines price, caching and workload shape.</text><text x="44" y="490" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">Nexus at peak Flash prices: 124 NOK · ratio 428× · off-peak share assumed 100 %</text><text x="44" y="514" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="400">Cost per completed task, quality and wall-clock per task are not measured.</text><text x="44" y="538" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">Estimates of API token cost, not invoices. Neither figure was reported by a provider.</text></svg>