<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Agent architecture"><defs><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#5b6b82"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker><marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker><marker id="v" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#047857"/></marker></defs><rect width="1200" height="640" fill="#ffffff"/><text x="44" y="48" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b1220">Agent architecture</text><text x="44" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6b82">Nexus is the only entry point. The other four run only as delegated child sessions.</text><rect x="470" y="104" width="260" height="92" rx="10" fill="#f6f8fb" stroke="#1d4ed8" stroke-width="1.3"/><rect x="470" y="104" width="4" height="92" rx="2" fill="#1d4ed8"/><text x="485" y="129" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">Nexus</text><text x="485" y="146" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">orchestrator · root session</text><rect x="44" y="280" width="262" height="104" rx="10" fill="#f6f8fb" stroke="#6d28d9" stroke-width="1.3"/><rect x="44" y="280" width="4" height="104" rx="2" fill="#6d28d9"/><text x="59" y="305" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">Jarvis</text><text x="59" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">planning</text><text x="59" y="339" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">decomposition, risk</text><line x1="600" y1="196" x2="175" y2="280" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#g)"/><rect x="332" y="280" width="262" height="104" rx="10" fill="#f6f8fb" stroke="#6d28d9" stroke-width="1.3"/><rect x="332" y="280" width="4" height="104" rx="2" fill="#6d28d9"/><text x="347" y="305" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">Ultron</text><text x="347" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">development</text><text x="347" y="339" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">code, infra, tests</text><line x1="600" y1="196" x2="463" y2="280" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#g)"/><rect x="620" y="280" width="262" height="104" rx="10" fill="#f6f8fb" stroke="#6d28d9" stroke-width="1.3"/><rect x="620" y="280" width="4" height="104" rx="2" fill="#6d28d9"/><text x="635" y="305" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">Athena</text><text x="635" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">research</text><text x="635" y="339" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">sources, analysis</text><line x1="600" y1="196" x2="751" y2="280" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#g)"/><rect x="908" y="280" width="262" height="104" rx="10" fill="#f6f8fb" stroke="#6d28d9" stroke-width="1.3"/><rect x="908" y="280" width="4" height="104" rx="2" fill="#6d28d9"/><text x="923" y="305" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">Sentinel</text><text x="923" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">quality</text><text x="923" y="339" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">falsify, verdicts</text><line x1="600" y1="196" x2="1039" y2="280" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#g)"/><rect x="44" y="424" width="540" height="92" rx="10" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.3"/><rect x="44" y="424" width="4" height="92" rx="2" fill="#94a3b8"/><text x="59" y="449" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">child context</text><text x="59" y="466" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">own prompt · own memory · own workspace</text><text x="59" y="483" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">plus the payload the parent wrote</text><rect x="616" y="424" width="540" height="92" rx="10" fill="#f6f8fb" stroke="#047857" stroke-width="1.3"/><rect x="616" y="424" width="4" height="92" rx="2" fill="#047857"/><text x="631" y="449" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">returned to the parent</text><text x="631" y="466" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">status · summary · token counts</text><text x="631" y="483" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">tool trace · transcript</text><text x="44" y="552" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">Same runtime and same model for all five: independence is procedural, not model diversity.</text><text x="44" y="574" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">Limits: 4 children per batch · depth 1 · 60 iterations · no shared conversation.</text><text x="44" y="608" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">Delegation is a routing decision (profile), not a second machine.</text></svg>