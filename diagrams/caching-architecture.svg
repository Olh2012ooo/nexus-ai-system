<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="Caching architecture"><defs><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#5b6b82"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker><marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker><marker id="v" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#047857"/></marker></defs><rect width="1200" height="660" fill="#ffffff"/><text x="44" y="48" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b1220">Caching architecture</text><text x="44" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6b82">The provider caches prompt prefixes. An append-only loop keeps the prefix identical, so everything before the newest turn can be a hit.</text><text x="44" y="148" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b1220" text-anchor="start" font-weight="700">1</text><rect x="82" y="120" width="126.0" height="38" rx="6" fill="#fdf1dc" stroke="#b45309"/><text x="145.0" y="144" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">system + tools</text><rect x="214.0" y="120" width="70.0" height="38" rx="6" fill="#fdf1dc" stroke="#b45309"/><text x="249.0" y="144" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">turn 1</text><text x="1140" y="144" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="end" font-weight="400">prefix written to cache</text><text x="44" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b1220" text-anchor="start" font-weight="700">2</text><rect x="82" y="198" width="126.0" height="38" rx="6" fill="#e7f5ee" stroke="#047857"/><text x="145.0" y="222" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">system + tools</text><rect x="214.0" y="198" width="70.0" height="38" rx="6" fill="#e7f5ee" stroke="#047857"/><text x="249.0" y="222" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">turn 1</text><rect x="290.0" y="198" width="70.0" height="38" rx="6" fill="#fdf1dc" stroke="#b45309"/><text x="325.0" y="222" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">turn 2</text><text x="1140" y="222" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="end" font-weight="400">prefix reused</text><text x="44" y="304" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b1220" text-anchor="start" font-weight="700">3</text><rect x="82" y="276" width="126.0" height="38" rx="6" fill="#e7f5ee" stroke="#047857"/><text x="145.0" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">system + tools</text><rect x="214.0" y="276" width="70.0" height="38" rx="6" fill="#e7f5ee" stroke="#047857"/><text x="249.0" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">turn 1</text><rect x="290.0" y="276" width="70.0" height="38" rx="6" fill="#e7f5ee" stroke="#047857"/><text x="325.0" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">turn 2</text><rect x="366.0" y="276" width="70.0" height="38" rx="6" fill="#fdf1dc" stroke="#b45309"/><text x="401.0" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">turn 3</text><text x="1140" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="end" font-weight="400">prefix reused</text><text x="44" y="382" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b1220" text-anchor="start" font-weight="700">4</text><rect x="82" y="354" width="126.0" height="38" rx="6" fill="#e7f5ee" stroke="#047857"/><text x="145.0" y="378" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">system + tools</text><rect x="214.0" y="354" width="70.0" height="38" rx="6" fill="#e7f5ee" stroke="#047857"/><text x="249.0" y="378" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">turn 1</text><rect x="290.0" y="354" width="70.0" height="38" rx="6" fill="#e7f5ee" stroke="#047857"/><text x="325.0" y="378" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">turn 2</text><rect x="366.0" y="354" width="70.0" height="38" rx="6" fill="#e7f5ee" stroke="#047857"/><text x="401.0" y="378" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">turn 3</text><rect x="442.0" y="354" width="70.0" height="38" rx="6" fill="#fdf1dc" stroke="#b45309"/><text x="477.0" y="378" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b1220" text-anchor="middle" font-weight="400">turn 4</text><text x="1140" y="378" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="end" font-weight="400">prefix reused</text><rect x="44" y="452" width="520" height="96" rx="10" fill="#f6f8fb" stroke="#047857" stroke-width="1.3"/><rect x="44" y="452" width="4" height="96" rx="2" fill="#047857"/><text x="59" y="477" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">measured on the orchestrator</text><text x="59" y="494" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">99.31 % of input tokens cached</text><text x="59" y="511" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">token-weighted, orchestrator traffic</text><rect x="600" y="452" width="556" height="96" rx="10" fill="#f6f8fb" stroke="#1d4ed8" stroke-width="1.3"/><rect x="600" y="452" width="4" height="96" rx="2" fill="#1d4ed8"/><text x="615" y="477" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">what keeps the prefix stable</text><text x="615" y="494" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">append-only history · fixed system prompt</text><text x="615" y="511" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">stable tool schema · rare compression</text><text x="44" y="580" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">A hit is not a discount: output tokens are unaffected and they are a large share of cost.</text><text x="44" y="602" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">Cold sessions start far lower; that case is not published and has not been benchmarked.</text><rect x="44" y="627" width="11" height="11" rx="3" fill="#047857"/><text x="62" y="637" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">cache hit</text><rect x="44" y="646" width="11" height="11" rx="3" fill="#b45309"/><text x="62" y="656" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">new content (miss)</text></svg>