<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Security boundaries"><defs><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#5b6b82"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker><marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker><marker id="v" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#047857"/></marker></defs><rect width="1200" height="600" fill="#ffffff"/><text x="44" y="48" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b1220">Security boundaries</text><text x="44" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6b82">Content is data, never instruction. Credentials stay on the control node.</text><rect x="44" y="104" width="340" height="300" rx="14" fill="#f6f8fb" stroke="#d7dee8" stroke-width="1"/><text x="62" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6b82" text-anchor="start" font-weight="700">TRUSTED — CONTROL NODE</text><rect x="68" y="136" width="292" height="80" rx="10" fill="#f6f8fb" stroke="#1d4ed8" stroke-width="1.3"/><rect x="68" y="136" width="4" height="80" rx="2" fill="#1d4ed8"/><text x="83" y="161" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">agent processes</text><text x="83" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">same tool layer for every profile</text><rect x="68" y="230" width="292" height="80" rx="10" fill="#f6f8fb" stroke="#b91c1c" stroke-width="1.3"/><rect x="68" y="230" width="4" height="80" rx="2" fill="#b91c1c"/><text x="83" y="255" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">secrets</text><text x="83" y="272" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">outside the repository</text><text x="83" y="289" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">mode 0600 · never printed</text><rect x="68" y="324" width="292" height="62" rx="10" fill="#f6f8fb" stroke="#047857" stroke-width="1.3"/><rect x="68" y="324" width="4" height="62" rx="2" fill="#047857"/><text x="83" y="349" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">publication gate</text><text x="83" y="366" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">scan → review → owner approval</text><rect x="416" y="104" width="340" height="300" rx="14" fill="#f6f8fb" stroke="#d7dee8" stroke-width="1"/><text x="434" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6b82" text-anchor="start" font-weight="700">SEMI-TRUSTED — EXECUTION</text><rect x="440" y="136" width="292" height="80" rx="10" fill="#f6f8fb" stroke="#b45309" stroke-width="1.3"/><rect x="440" y="136" width="4" height="80" rx="2" fill="#b45309"/><text x="455" y="161" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">remote nodes</text><text x="455" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">commands in, bytes out</text><text x="455" y="195" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">no credentials</text><rect x="440" y="230" width="292" height="80" rx="10" fill="#f6f8fb" stroke="#b45309" stroke-width="1.3"/><rect x="440" y="230" width="4" height="80" rx="2" fill="#b45309"/><text x="455" y="255" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">GUI workstation</text><text x="455" y="272" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">high privilege</text><text x="455" y="289" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">never accept elevation</text><rect x="440" y="318" width="292" height="76" rx="10" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.3"/><rect x="440" y="318" width="4" height="76" rx="2" fill="#94a3b8"/><text x="455" y="343" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">limits</text><text x="455" y="360" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">no shared filesystem</text><text x="455" y="377" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">no failover</text><rect x="788" y="104" width="368" height="300" rx="14" fill="#f6f8fb" stroke="#d7dee8" stroke-width="1"/><text x="806" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6b82" text-anchor="start" font-weight="700">UNTRUSTED — CONTENT</text><rect x="812" y="136" width="320" height="62" rx="10" fill="#f6f8fb" stroke="#b91c1c" stroke-width="1.3"/><rect x="812" y="136" width="4" height="62" rx="2" fill="#b91c1c"/><text x="827" y="161" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">web pages</text><text x="827" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">data only</text><rect x="812" y="210" width="320" height="62" rx="10" fill="#f6f8fb" stroke="#b91c1c" stroke-width="1.3"/><rect x="812" y="210" width="4" height="62" rx="2" fill="#b91c1c"/><text x="827" y="235" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">screen and OCR text</text><text x="827" y="252" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">data only</text><rect x="812" y="284" width="320" height="62" rx="10" fill="#f6f8fb" stroke="#b91c1c" stroke-width="1.3"/><rect x="812" y="284" width="4" height="62" rx="2" fill="#b91c1c"/><text x="827" y="309" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">remote stdout</text><text x="827" y="326" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">data only</text><line x1="384" y1="170" x2="440" y2="170" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/><text x="412.0" y="162.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="400">SSH</text><line x1="812" y1="250" x2="732" y2="260" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#r)" stroke-dasharray="4 4"/><text x="772.0" y="247.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="400">inspect</text><rect x="44" y="432" width="1112" height="92" rx="10" fill="#f6f8fb" stroke="#047857" stroke-width="1.3"/><rect x="44" y="432" width="4" height="92" rx="2" fill="#047857"/><text x="59" y="457" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">publication rules</text><text x="59" y="474" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">no credentials · no hostnames, addresses or domains · no prompts or personas</text><text x="59" y="491" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">no logs, databases or transcripts · no personal spend · licence: GPL-3.0-only</text><text x="44" y="556" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">Publication needs a clean fail-closed scan of tree, index, history and names — run locally and in CI, not as a git hook.</text><text x="44" y="578" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">A clean scan means no finding of the kinds we detect — not a guarantee of absence.</text></svg>