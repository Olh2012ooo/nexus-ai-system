<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Task lifecycle"><defs><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#5b6b82"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#b45309"/></marker><marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker><marker id="v" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#047857"/></marker></defs><rect width="1200" height="680" fill="#ffffff"/><text x="44" y="48" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#0b1220">Task lifecycle</text><text x="44" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5b6b82">One board per project stream. States change through commands; a task closes only with evidence.</text><rect x="44" y="140" width="200" height="104" rx="10" fill="#f6f8fb" stroke="#1d4ed8" stroke-width="1.3"/><rect x="44" y="140" width="4" height="104" rx="2" fill="#1d4ed8"/><text x="59" y="165" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">todo</text><text x="59" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">defined, not actionable</text><rect x="268" y="140" width="200" height="104" rx="10" fill="#f6f8fb" stroke="#1d4ed8" stroke-width="1.3"/><rect x="268" y="140" width="4" height="104" rx="2" fill="#1d4ed8"/><text x="283" y="165" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">ready</text><text x="283" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">waiting for a worker</text><line x1="244" y1="192" x2="264" y2="192" stroke="#5b6b82" stroke-width="1.4" marker-end="url(#g)"/><rect x="492" y="140" width="200" height="104" rx="10" fill="#f6f8fb" stroke="#1d4ed8" stroke-width="1.3"/><rect x="492" y="140" width="4" height="104" rx="2" fill="#1d4ed8"/><text x="507" y="165" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">running</text><text x="507" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">atomic claim held</text><line x1="468" y1="192" x2="488" y2="192" stroke="#5b6b82" stroke-width="1.4" marker-end="url(#g)"/><rect x="716" y="140" width="200" height="104" rx="10" fill="#f6f8fb" stroke="#1d4ed8" stroke-width="1.3"/><rect x="716" y="140" width="4" height="104" rx="2" fill="#1d4ed8"/><text x="731" y="165" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">review</text><text x="731" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">awaiting check</text><line x1="692" y1="192" x2="712" y2="192" stroke="#5b6b82" stroke-width="1.4" marker-end="url(#g)"/><rect x="940" y="140" width="200" height="104" rx="10" fill="#f6f8fb" stroke="#047857" stroke-width="1.3"/><rect x="940" y="140" width="4" height="104" rx="2" fill="#047857"/><text x="955" y="165" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">done</text><text x="955" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">closed with result</text><line x1="916" y1="192" x2="936" y2="192" stroke="#5b6b82" stroke-width="1.4" marker-end="url(#g)"/><path d="M644,140 L644,100 L556,100 L556,140" fill="none" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#b)" stroke-dasharray="4 4"/><text x="600" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="400">dispatch claims atomically</text><path d="M864,244 L864,288 L756,288 L756,244" fill="none" stroke="#047857" stroke-width="1.4" marker-end="url(#v)" stroke-dasharray="4 4"/><text x="810" y="306" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#047857" text-anchor="middle" font-weight="400">request-changes returns it</text><rect x="44" y="320" width="304" height="88" rx="10" fill="#f6f8fb" stroke="#b45309" stroke-width="1.3"/><rect x="44" y="320" width="4" height="88" rx="2" fill="#b45309"/><text x="59" y="345" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">blocked</text><text x="59" y="362" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">reason recorded on the task</text><text x="59" y="379" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">returns with unblock</text><line x1="148" y1="244" x2="148" y2="320" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="4 4"/><rect x="380" y="320" width="776" height="154" rx="14" fill="#f6f8fb" stroke="#d7dee8" stroke-width="1"/><text x="398" y="344" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6b82" text-anchor="start" font-weight="700">WHAT COMPLETION REQUIRES</text><text x="404" y="354" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">result string: what changed, which files, which command, what it returned</text><text x="404" y="380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">review by a separate session that receives artefacts, not the author's conclusion</text><text x="404" y="406" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">comments, links and attachments stay on the task as its record</text><text x="404" y="432" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">board is authoritative · documentation mirrors it</text><text x="404" y="458" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">manual: priority, scope, approval · automatic: claim, dispatch, retries, heartbeats</text><rect x="44" y="519" width="11" height="11" rx="3" fill="#1d4ed8"/><text x="62" y="529" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">active flow</text><rect x="44" y="538" width="11" height="11" rx="3" fill="#047857"/><text x="62" y="548" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">completion</text><rect x="44" y="557" width="11" height="11" rx="3" fill="#b45309"/><text x="62" y="567" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">blocked</text><text x="44" y="596" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">A result string is a receipt. 'Looks done' is not a state transition.</text><text x="44" y="620" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b82" text-anchor="start" font-weight="400">One board database per stream; cross-board dependencies are not modelled.</text></svg>