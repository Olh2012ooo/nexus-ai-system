y="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">5 profiles</text><rect x="288" y="136" width="202" height="92" rx="10" fill="#f6f8fb" stroke="#1d4ed8" stroke-width="1.3"/><rect x="288" y="136" width="4" height="92" rx="2" fill="#1d4ed8"/><text x="303" y="161" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">runtime</text><text x="303" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">loop · tools · context</text><rect x="68" y="248" width="200" height="84" rx="10" fill="#f6f8fb" stroke="#047857" stroke-width="1.3"/><rect x="68" y="248" width="4" height="84" rx="2" fill="#047857"/><text x="83" y="273" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">state</text><text x="83" y="290" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">session DB · boards</text><rect x="288" y="248" width="202" height="84" rx="10" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.3"/><rect x="288" y="248" width="4" height="84" rx="2" fill="#94a3b8"/><text x="303" y="273" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">services</text><text x="303" y="290" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">gateway · dashboard</text><text x="303" y="307" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">monitoring</text><rect x="552" y="104" width="300" height="300" rx="14" fill="#f6f8fb" stroke="#d7dee8" stroke-width="1"/><text x="570" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6b82" text-anchor="start" font-weight="700">REMOTE EXECUTION NODES</text><rect x="576" y="136" width="252" height="54" rx="10" fill="#f6f8fb" stroke="#b45309" stroke-width="1.3"/><rect x="576" y="136" width="4" height="54" rx="2" fill="#b45309"/><text x="591" y="161" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">node 1</text><text x="591" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">shell only · no runtime</text><rect x="576" y="202" width="252" height="54" rx="10" fill="#f6f8fb" stroke="#b45309" stroke-width="1.3"/><rect x="576" y="202" width="4" height="54" rx="2" fill="#b45309"/><text x="591" y="227" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">node 2</text><text x="591" y="244" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">shell only · no runtime</text><rect x="576" y="268" width="252" height="54" rx="10" fill="#f6f8fb" stroke="#b45309" stroke-width="1.3"/><rect x="576" y="268" width="4" height="54" rx="2" fill="#b45309"/><text x="591" y="293" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">node 3</text><text x="591" y="310" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">shell only · no runtime</text><rect x="576" y="334" width="252" height="54" rx="10" fill="#f6f8fb" stroke="#b45309" stroke-width="1.3"/><rect x="576" y="334" width="4" height="54" rx="2" fill="#b45309"/><text x="591" y="359" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">node 4</text><text x="591" y="376" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">shell only · no runtime</text><rect x="890" y="104" width="266" height="300" rx="14" fill="#f6f8fb" stroke="#d7dee8" stroke-width="1"/><text x="908" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6b82" text-anchor="start" font-weight="700">WINDOWS WORKSTATION</text><rect x="914" y="136" width="218" height="96" rx="10" fill="#f6f8fb" stroke="#b91c1c" stroke-width="1.3"/><rect x="914" y="136" width="4" height="96" rx="2" fill="#b91c1c"/><text x="929" y="161" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">GUI automation</text><text x="929" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">MCP over SSH</text><text x="929" y="195" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">screen · pointer · keys</text><rect x="914" y="250" width="218" height="96" rx="10" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.3"/><rect x="914" y="250" width="4" height="96" rx="2" fill="#94a3b8"/><text x="929" y="275" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#0b1220">policy</text><text x="929" y="292" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">never accept elevation</text><text x="929" y="309" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b82">report and stop</text><line x1="514" y1="200" x2="552" y2="200" stroke="#5b6b82" stroke-width="1.4" marker-end="url(#g)"/><text x="533.0" y="192.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6b82" text-anchor="middle" font-weight="400">SSH</text><path d="M514,300 L552,300" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/><path d="M300,404 L300,456 L1023,456 L1023,232" fill="none" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#r)" stroke-dasharray="4 4"/><text x="660" y="448" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="400">MCP over SSH</text><rect x="44" y="500" width="540" height="84" rx="10" fill="#f6f8fb" stroke="#9